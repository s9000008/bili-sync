# fly.toml app configuration file generated for bili-sync on 2026-05-13T11:15:05Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bili-sync'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
